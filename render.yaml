# AccessiBooks — Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: accessibooks
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: accessibooks-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DRM_SIGNING_SECRET
        generateValue: true
      - key: ENABLE_CATALOG_SEEDER
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false

databases:
  - name: accessibooks-db
    plan: starter
    databaseName: accessibooks
    user: accessibooks
