name: CI

on:
  push:
    branches: [main, master, replit-agent, "cursor/**"]
  pull_request:
    branches: [main, master, replit-agent]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-session-secret
          DRM_SIGNING_SECRET: ci-drm-secret
