  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a;">
        <h1 style="font-size: 1.75rem; margin: 0 0 0.5rem;">AccessiBooks</h1>
        <p style="font-size: 1.1rem; margin: 0 0 1rem;">
          AccessiBooks is an accessibility-first audiobook and e-reading platform from
          Australian Disability Ltd. Browse and stream thousands of audiobooks, ebooks,
          and magazines with transcripts, screen-reader support, keyboard navigation,
          adjustable playback, dyslexia-friendly modes, and high-contrast themes.
        </p>
        <p style="margin: 0 0 1rem;">
          <strong>JavaScript is required</strong> to use the interactive reader and audio
          player. Please enable JavaScript in your browser, then reload this page.
        </p>
        <p style="margin: 0;">
          Need help or want to report an accessibility barrier? Email
          <a href="mailto:accessibility@accessibooks.org" style="color: #b23000;">accessibility@accessibooks.org</a>
          or visit the
          <a href="https://www.australiandisability.org.au" style="color: #b23000;">Australian Disability Ltd website</a>.
        </p>
      </div>
    </noscript>
